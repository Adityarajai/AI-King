<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI King - Grand Chat Court</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0b132b; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .brand-container {
            text-align: center;
            padding: 10px;
            margin-top: 5px;
        }

        .logo-fallback {
            font-size: 24px;
            font-weight: bold;
            color: #ffb703;
            text-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
        }

        /* Chat Window Container */
        .chat-container {
            width: 95%;
            max-width: 600px;
            height: 75vh;
            background: #1c2541; 
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* Chat Messages Area */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Message Bubbles */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 16px;
        }

        .user-message {
            background-color: #00b4d8;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .king-message {
            background-color: #3a506b;
            color: #ffb703;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 183, 3, 0.2);
        }

        .system-message {
            background: transparent;
            color: #5c677d;
            align-self: center;
            font-style: italic;
            font-size: 14px;
        }

        /* Input Area at Bottom */
        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #0b132b;
            gap: 10px;
            border-top: 1px solid #5c677d;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #5c677d;
            background-color: #1c2541;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #5c677d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="brand-container">
    <div class="logo-fallback">👑 AI KING COURT</div>
</div>

<div class="chat-container">
    <div class="chat-messages" id="chat-box">
        <div class="message king-message">👑 <strong>AI King:</strong> Welcome to my Grand Court. Speak, traveler, and I shall decree.</div>
    </div>
    
    <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Type your question to the King..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // Enter key dabane par bhi send ho jaye
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. User ka message chat mein dikhayein
        appendMessage(text, 'user-message');
        userInput.value = ''; // Input clear karein

        // 2. Loading state ("The King is thinking...")
        const loadingId = appendMessage('The King is preparing his decree...', 'system-message');
        
        sendBtn.disabled = true;

        // Aapka naya Vercel backend URL
        const backendUrl = "https://ai-king-amber.vercel.app/api/ask"; 

        try {
            const response = await fetch(backendUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: text })
            });

            const data = await response.json();
            
            // Loading text ko hataayein
            document.getElementById(loadingId).remove();

            let kingReply = data.reply || "The royal chamber is silent right now.";
            
            // 3. King ka answer bubble chat mein jodein
            appendMessage(`👑 <strong>AI King:</strong> ${kingReply}`, 'king-message');

        } catch (error) {
            console.error(error);
            document.getElementById(loadingId).remove();
            appendMessage('Error: Connection to the palace failed.', 'system-message');
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    // Naya message bubble jodne ka function
    function appendMessage(text, className) {
        const messageDiv = document.createElement('div');
        const uniqueId = 'msg-' + Date.now();
        messageDiv.id = uniqueId;
        messageDiv.className = `message ${className}`;
        messageDiv.innerHTML = text;
        chatBox.appendChild(messageDiv);
        
        // Chat scroll automatically niche le jane ke liye
        chatBox.scrollTop = chatBox.scrollHeight;
        
        return uniqueId;
    }
</script>

</body>
</html>
