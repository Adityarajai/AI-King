<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI King - a fast web-search assistant">
    <title>AI King - Professional Dashboard</title>
    <link rel="icon" type="image/png" href="image.png">
    <style>
        :root {
            --cyan: #55e7ff;
            --violet: #9d7aff;
            --text: #f5f7ff;
            --muted: #9ca3b3;
            --panel: rgba(17, 20, 28, .86);
            --line: rgba(255, 255, 255, .11);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100dvh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text);
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background:
                radial-gradient(circle at 14% 12%, rgba(85, 231, 255, .16), transparent 28%),
                radial-gradient(circle at 88% 84%, rgba(157, 122, 255, .20), transparent 32%),
                #05070c;
        }

        .chat-container {
            position: relative;
            isolation: isolate;
            display: flex;
            flex-direction: column;
            width: min(100%, 780px);
            height: min(880px, calc(100dvh - 40px));
            overflow: hidden;
            border: 1px solid rgba(85, 231, 255, .25);
            border-radius: 30px;
            background: var(--panel);
            box-shadow: 0 0 0 1px rgba(157, 122, 255, .12), 0 0 45px rgba(85, 231, 255, .08), 0 30px 90px rgba(0, 0, 0, .62);
            backdrop-filter: blur(24px);
        }

        .chat-container::before {
            content: "";
            position: absolute;
            inset: -1px;
            z-index: 4;
            pointer-events: none;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(85, 231, 255, .7), transparent 30%, transparent 68%, rgba(157, 122, 255, .65));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .header {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 84px;
            padding: 18px 28px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(90deg, rgba(85, 231, 255, .08), transparent 38%, rgba(157, 122, 255, .08)), rgba(15, 19, 30, .86);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: .8px;
        }

        .header::before {
            content: "◆  AI SYSTEM";
            position: absolute;
            top: 10px;
            left: 28px;
            color: rgba(85, 231, 255, .7);
            font-size: .48rem;
            letter-spacing: 2px;
        }

        .status {
            margin-left: auto;
            color: var(--cyan);
            font-size: .58rem;
            letter-spacing: 1.1px;
            text-shadow: 0 0 10px rgba(85, 231, 255, .7);
        }

        .header img, .avatar {
            flex: 0 0 auto;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--cyan);
            box-shadow: 0 0 0 4px rgba(85, 231, 255, .06), 0 0 24px rgba(85, 231, 255, .28);
        }

        .header img { width: 44px; height: 44px; }

        .chat-box {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 22px;
            padding: 34px clamp(18px, 5vw, 58px);
            overflow-y: auto;
            scroll-behavior: smooth;
            background: radial-gradient(circle at 50% 0%, rgba(245, 196, 81, .06), transparent 42%);
        }

        .chat-box::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .3;
            background: repeating-linear-gradient(0deg, transparent 0, transparent 5px, rgba(255, 255, 255, .012) 6px);
        }

        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { border-radius: 10px; background: rgba(85, 231, 255, .25); }

        .message-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: min(88%, 620px);
        }

        .user-wrapper { align-self: flex-end; flex-direction: row-reverse; }
        .bot-wrapper { align-self: flex-start; }
        .avatar { width: 34px; height: 34px; border-color: rgba(85, 231, 255, .55); }

        .message {
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 18px;
            line-height: 1.65;
            font-size: .98rem;
            word-break: break-word;
            white-space: pre-wrap;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .18);
            animation: fadeIn .3s ease-out;
        }

        .bot { border-left: 2px solid rgba(85, 231, 255, .5); border-top-left-radius: 6px; background: linear-gradient(135deg, rgba(35, 44, 58, .94), rgba(24, 28, 42, .94)); }
        .user { border-right: 2px solid rgba(157, 122, 255, .72); border-top-right-radius: 6px; color: #19140a; background: linear-gradient(135deg, #fff0b8, #e8ad3b 65%, #bc7c20); }
        .thinking-msg { color: var(--cyan); font-style: italic; animation: pulse 1.5s infinite ease-in-out; }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px 24px 24px;
            border-top: 1px solid var(--line);
            background: linear-gradient(90deg, rgba(85, 231, 255, .04), transparent, rgba(157, 122, 255, .04)), rgba(7, 10, 17, .88);
        }

        input {
            min-width: 0;
            flex: 1;
            padding: 16px 18px;
            outline: none;
            border: 1px solid rgba(85, 231, 255, .18);
            border-radius: 15px;
            color: white;
            background: rgba(13, 19, 30, .92);
            font: inherit;
        }

        input::placeholder { color: #777f91; }
        input:focus { border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(85, 231, 255, .08), 0 0 22px rgba(85, 231, 255, .12); }

        button {
            min-width: 96px;
            padding: 0 22px;
            border: 0;
            border-radius: 15px;
            cursor: pointer;
            color: #071017;
            background: linear-gradient(135deg, #b8f7ff 0%, #55e7ff 46%, #8d72ff 140%);
            font: inherit;
            font-weight: 700;
            box-shadow: 0 0 18px rgba(85, 231, 255, .22), 0 8px 20px rgba(0, 0, 0, .25);
        }

        button:hover { filter: brightness(1.08); }
        button:disabled, input:disabled { opacity: .55; cursor: not-allowed; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

        @media (max-width: 560px) {
            body { padding: 0; align-items: stretch; }
            .chat-container { width: 100%; height: 100dvh; border: 0; border-radius: 0; }
            .header { min-height: 76px; padding: 18px; }
            .header::before { left: 18px; }
            .status { font-size: .5rem; }
            .header img { width: 38px; height: 38px; }
            .chat-box { padding: 24px 14px; }
            .message-wrapper { max-width: 92%; }
            .input-area { padding: 14px; }
            button { min-width: 76px; padding-inline: 14px; }
        }

        .consent-banner {
            position: fixed;
            left: 22px;
            right: 22px;
            bottom: 22px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: min(780px, calc(100% - 44px));
            margin: auto;
            padding: 16px 18px;
            border: 1px solid rgba(85, 231, 255, 0.24);
            border-radius: 16px;
            background: rgba(12, 18, 29, 0.96);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(18px);
        }

        .consent-copy {
            color: #c7d1e3;
            font-size: 0.78rem;
            line-height: 1.5;
        }

        .consent-copy strong { display: block; color: #fff; margin-bottom: 3px; }

        .consent-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .consent-actions button { min-width: auto; min-height: 36px; padding: 0 14px; font-size: 0.75rem; }
        .consent-actions .secondary {
            color: #aebbd0;
            border: 1px solid rgba(255,255,255,.14);
            background: transparent;
            box-shadow: none;
        }

        @media (max-width: 560px) {
            .consent-banner { left: 12px; right: 12px; bottom: 12px; width: calc(100% - 24px); display: block; }
            .consent-actions { margin-top: 12px; }
        }
    </style>
</head>
<body>
    <main class="chat-container">
        <header class="header">
            <img src="image.png" alt="AI King logo">
            <span>AI King</span>
            <span class="status" aria-label="Online and ready to help">● ONLINE / READY</span>
        </header>

        <section class="chat-box" id="chatBox" aria-live="polite" aria-label="Chat messages"></section>

        <aside class="consent-banner" id="consentBanner" hidden>
            <div class="consent-copy">
                <strong>Help improve AI King</strong>
                Allow anonymous search analytics so the admin can see search trends. Your name, password, and search history are not linked to your identity.
            </div>
            <div class="consent-actions">
                <button class="secondary" type="button" onclick="setAnalyticsConsent('denied')">Not now</button>
                <button type="button" onclick="setAnalyticsConsent('granted')">Allow</button>
            </div>
        </aside>

        <form class="input-area" id="chatForm">
            <input type="text" id="userInput" aria-label="Ask AI King a question" placeholder="Ask anything to search live..." autocomplete="off" maxlength="500">
            <button type="submit" id="sendButton">Send</button>
        </form>
    </main>

    <script>
        const HISTORY_KEY = "aiKingMessages";
        const inputEl = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const sendButton = document.getElementById("sendButton");
        const chatForm = document.getElementById("chatForm");
        const ANALYTICS_CONSENT_KEY = "aiKingAnalyticsConsent";

        function setAnalyticsConsent(value) {
            localStorage.setItem(ANALYTICS_CONSENT_KEY, value);
            document.getElementById("consentBanner").hidden = true;
        }

        function recordSearch(query) {
            if (localStorage.getItem(ANALYTICS_CONSENT_KEY) !== "granted") return;
            fetch("/api/analytics", {
                method: "POST",
                headers: { "Content-Type": "application/json", Accept: "application/json" },
                body: JSON.stringify({ query, consent: true })
            }).catch(() => {});
        }

        if (!localStorage.getItem(ANALYTICS_CONSENT_KEY)) {
            document.getElementById("consentBanner").hidden = false;
        }

        document.addEventListener("DOMContentLoaded", loadHistory);
        chatForm.addEventListener("submit", event => {
            event.preventDefault();
            sendMessage();
        });

        function loadHistory() {
            let messages = [];
            try { messages = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch (_) {}
            if (!Array.isArray(messages) || messages.length === 0) {
                appendMessage("Hello, I am Adity's AI, AI King. How can I help you?", "bot", false, false);
                return;
            }
            messages.slice(-50).forEach(message => appendMessage(message.text, message.sender, false, false));
        }

        function saveMessage(text, sender) {
            try {
                const messages = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
                messages.push({ text, sender });
                localStorage.setItem(HISTORY_KEY, JSON.stringify(messages.slice(-50)));
            } catch (_) {}
        }

        async function sendMessage() {
            const userText = inputEl.value.trim();
            if (!userText || sendButton.disabled) return;

            recordSearch(userText);
            appendMessage(userText, "user");
            inputEl.value = "";
            inputEl.disabled = true;
            sendButton.disabled = true;
            const thinkingId = appendMessage("Thinking...", "bot", true);

            try {
                const result = calculateExpression(userText);
                if (result !== null) {
                    removeMessage(thinkingId);
                    appendMessage(`[AI King]: Result: ${result}`, "bot");
                    return;
                }

                const reply = await searchWeb(userText);
                removeMessage(thinkingId);
                appendMessage(`[AI King]: ${reply}`, "bot");
            } catch (error) {
                removeMessage(thinkingId);
                appendMessage("[AI King]: Connection timeout. Live data could not be fetched. Please try again later.", "bot");
            } finally {
                inputEl.disabled = false;
                sendButton.disabled = false;
                inputEl.focus();
            }
        }

        async function searchWeb(query) {
            const wikiSearch = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
            const searchResponse = await fetch(wikiSearch, { signal: AbortSignal.timeout(10000) });
            if (!searchResponse.ok) throw new Error("Wikipedia search failed");
            const searchData = await searchResponse.json();
            const firstResult = searchData.query?.search?.[0];

            if (firstResult) {
                const summaryUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(firstResult.title)}`;
                const summaryResponse = await fetch(summaryUrl, { signal: AbortSignal.timeout(10000) });
                const summaryData = await summaryResponse.json();
                if (summaryData.extract) return summaryData.extract;
            }

            const duckUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(duckUrl)}`;
            const proxyResponse = await fetch(proxyUrl, { signal: AbortSignal.timeout(10000) });
            if (!proxyResponse.ok) throw new Error("Search fallback failed");
            const proxyData = await proxyResponse.json();
            const data = JSON.parse(proxyData.contents || "{}");
            return data.AbstractText || data.RelatedTopics?.[0]?.Text || "I could not find a useful answer. Please try a more specific question.";
        }

        // Safe basic calculator: avoids eval() and Function().
        function calculateExpression(expression) {
            if (!/^[0-9+\-*/().\s]+$/.test(expression)) return null;
            const tokens = expression.match(/\d*\.?\d+|[()+\-*/]/g);
            if (!tokens || tokens.join("") !== expression.replace(/\s/g, "")) return null;
            const values = [], operators = [];
            const precedence = { "+": 1, "-": 1, "*": 2, "/": 2 };
            const apply = () => {
                const operator = operators.pop();
                const b = values.pop();
                const a = values.pop();
                if (a === undefined || b === undefined) throw new Error("Invalid expression");
                if (operator === "/" && b === 0) throw new Error("Division by zero");
                values.push(operator === "+" ? a + b : operator === "-" ? a - b : operator === "*" ? a * b : a / b);
            };
            try {
                tokens.forEach(token => {
                    if (!isNaN(token)) values.push(Number(token));
                    else if (token === "(") operators.push(token);
                    else if (token === ")") {
                        while (operators.at(-1) !== "(") apply();
                        if (operators.pop() !== "(") throw new Error("Invalid expression");
                    } else {
                        while (operators.length && operators.at(-1) !== "(" && precedence[operators.at(-1)] >= precedence[token]) apply();
                        operators.push(token);
                    }
                });
                while (operators.length) {
                    if (operators.at(-1) === "(") throw new Error("Invalid expression");
                    apply();
                }
                return values.length === 1 && Number.isFinite(values[0]) ? values[0] : null;
            } catch (_) { return null; }
        }

        function appendMessage(text, sender, isThinking = false, save = true) {
            const wrapper = document.createElement("div");
            const id = `msg-wrap-${crypto.randomUUID()}`;
            wrapper.id = id;
            wrapper.className = `message-wrapper ${sender}-wrapper`;

            if (sender === "bot") {
                const avatar = document.createElement("img");
                avatar.src = "image.png";
                avatar.className = "avatar";
                avatar.alt = "AI King avatar";
                wrapper.appendChild(avatar);
            }

            const message = document.createElement("div");
            message.className = `message ${sender}${isThinking ? " thinking-msg" : ""}`;
            message.textContent = text;
            wrapper.appendChild(message);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            if (save && !isThinking) saveMessage(text, sender);
            return id;
        }

        function removeMessage(id) {
            document.getElementById(id)?.remove();
        }
    </script>
</body>
</html>
