<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI King</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body { 
            background-color: #1a1a1a; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .chat-container { 
            width: 100%; 
            max-width: 450px; 
            height: 85vh; 
            background: #2d2d2d; 
            border-radius: 15px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.3); 
        }
        .header { 
            background: #ffd700; 
            color: #1a1a1a; 
            padding: 15px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 1.4rem; 
            letter-spacing: 1px; 
        }
        .chat-box { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .message { 
            padding: 10px 14px; 
            border-radius: 10px; 
            max-width: 80%; 
            word-wrap: break-word; 
            line-height: 1.4; 
        }
        .user { 
            background: #ffd700; 
            color: #1a1a1a; 
            align-self: flex-end; 
        }
        .bot { 
            background: #404040; 
            color: #fff; 
            align-self: flex-start; 
        }
        .input-area { 
            display: flex; 
            padding: 10px; 
            background: #222; 
            gap: 10px; 
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            background: #333; 
            color: white; 
            outline: none; 
        }
        button { 
            background: #ffd700; 
            border: none; 
            color: #1a1a1a; 
            padding: 0 20px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button:hover { 
            background: #e6c200; 
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">👑 AI KING 👑</div>
    <div class="chat-box" id="chatBox">
        <div class="message bot">Greetings! I am AI King. How may I assist your highness today?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask your King something..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputEl = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const userText = inputEl.value.trim();
        
        if (!userText) return;

        // Append User Message
        appendMessage(userText, 'user');
        inputEl.value = '';

        // Append Temporary Thinking Message
        const thinkingId = appendMessage("Thinking...", 'bot');

        try {
            // Using a reliable public instant-answer endpoint
            const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(userText)}&format=json&origin=*`);
            const data = await response.json();
            
            // Remove thinking message
            document.getElementById(thinkingId).remove();
            
            // Extract answer or use fallback response
            const reply = data.AbstractText || (data.RelatedTopics && data.RelatedTopics[0]?.Text) || "I am processing your command, your highness, but my repository lacks specific details on this exact matter.";
            appendMessage(reply, 'bot');
            
        } catch (error) {
            document.getElementById(thinkingId).remove();
            appendMessage("Apologies, my kingdom's servers are experiencing issues.", 'bot');
            console.error("Error fetching data:", error);
        }
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        const id = 'msg-' + Date.now();
        msgDiv.id = id;
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return id;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
