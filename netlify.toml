[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/analytics"
  to = "/.netlify/functions/analytics"
  status = 200

[[redirects]]
  from = "/api/admin/events"
  to = "/.netlify/functions/analytics"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200